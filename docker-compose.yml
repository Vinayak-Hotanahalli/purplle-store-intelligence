services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./outputs:/app/outputs

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile

    ports:
      - "8501:8501"

    volumes:
      - ./outputs:/app/outputs

    depends_on:
      - api